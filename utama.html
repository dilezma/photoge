<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FotoKu - Gallery</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="gallery-container">
        <nav class="gallery-nav">
            <div class="nav-brand">
                <i class="fas fa-camera"></i>
                <h1>Galeri Foto</h1>
            </div>
            <div class="user-info">
                <span id="current-user">Loading...</span>
                <button id="logout-user-btn" class="btn-logout-small">
                    <i class="fas fa-sign-out-alt"></i> Keluar
                </button>
            </div>
        </nav>
        
        <main class="gallery-main">
            <div class="stats-container">
                <div class="stat-card user-stat">
                    <div class="stat-icon">
                        <i class="fas fa-user-circle"></i>
                    </div>
                    <div class="stat-content">
                        <h3>Jumlah Gambar Anda</h3>
                        <p class="stat-number" id="user-photos-count">0</p>
                    </div>
                </div>
                
                <div class="stat-card total-stat">
                    <div class="stat-icon">
                        <i class="fas fa-globe"></i>
                    </div>
                    <div class="stat-content">
                        <h3>Total Gambar Semua User</h3>
                        <p class="stat-number" id="total-photos-count">0</p>
                    </div>
                </div>
            </div>
            
            <div class="upload-section">
                <button id="upload-btn" class="btn-upload">
                    <i class="fas fa-plus-circle"></i> Tambah Gambar
                </button>
                <input type="file" id="file-input" accept="image/*" multiple style="display: none;">
            </div>
            
            <div class="gallery-section">
                <h2><i class="fas fa-images"></i> Foto Anda</h2>
                <div class="gallery-grid" id="gallery-grid">
                    <!-- Gambar akan dimuat di sini -->
                    <div class="empty-gallery">
                        <i class="fas fa-image"></i>
                        <p>Belum ada foto. Klik "Tambah Gambar" untuk mengunggah.</p>
                    </div>
                </div>
            </div>
        </main>
        
        <!-- Modal untuk preview gambar -->
        <div class="modal-overlay" id="image-modal">
            <div class="image-modal-content">
                <button class="close-modal"><i class="fas fa-times"></i></button>
                <img id="modal-image" src="" alt="Preview">
                <div class="modal-actions">
                    <button id="download-btn" class="btn-download">
                        <i class="fas fa-download"></i> Download
                    </button>
                    <button id="delete-btn" class="btn-delete">
                        <i class="fas fa-trash"></i> Hapus
                    </button>
                </div>
            </div>
        </div>
        
        <div class="notification" id="notification"></div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
