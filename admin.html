<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FotoKu - Admin Panel</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="admin-container">
        <nav class="admin-nav">
            <div class="nav-brand">
                <i class="fas fa-user-shield"></i>
                <h1>Admin Panel</h1>
            </div>
            <div class="nav-actions">
                <button id="logout-btn" class="btn-logout">
                    <i class="fas fa-sign-out-alt"></i> Keluar
                </button>
                <button id="refresh-btn" class="btn-refresh">
                    <i class="fas fa-sync-alt"></i> Refresh
                </button>
            </div>
        </nav>
        
        <main class="admin-main">
            <div class="stats-container">
                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="fas fa-users"></i>
                    </div>
                    <div class="stat-content">
                        <h3>Jumlah Semua User</h3>
                        <p class="stat-number" id="total-users">0</p>
                    </div>
                </div>
                
                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="fas fa-images"></i>
                    </div>
                    <div class="stat-content">
                        <h3>Jumlah Semua Foto</h3>
                        <p class="stat-number" id="total-photos">0</p>
                    </div>
                </div>
            </div>
            
            <div class="admin-section">
                <h2><i class="fas fa-list"></i> Daftar Pengguna</h2>
                <div class="table-container">
                    <table class="user-table">
                        <thead>
                            <tr>
                                <th>NO</th>
                                <th>USERNAME</th>
                                <th>JUMLAH FOTO</th>
                                <th>AKSI</th>
                            </tr>
                        </thead>
                        <tbody id="users-table-body">
                            <!-- Data akan dimuat di sini -->
                            <tr>
                                <td colspan="4" class="empty-message">Memuat data...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
        
        <div class="notification" id="notification"></div>
        <div class="modal-overlay" id="admin-password-modal">
            <div class="modal">
                <h3><i class="fas fa-lock"></i> Masukkan Password Admin</h3>
                <input type="password" id="admin-password" placeholder="Password admin">
                <div class="modal-actions">
                    <button id="submit-admin-password" class="btn-primary">Masuk</button>
                    <button id="cancel-admin" class="btn-secondary">Batal</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
